<div class="card">
    <div class="card-img-wrapper">
        <img class="card-img-top" src="{{member().photoUrl}}" alt="{{member().knownAs}}">
        <div class="member-icons animate">
            <button 
                routerLink="/members/{{member().username}}" 
                class="member-icon"
                title="View Profile"
            >
                <i class="fas fa-user"></i>
            </button>
            <button 
                (click)="toggleLike()" 
                class="member-icon like-btn"
                title="Like"
                [style.color]="hasLiked() ? '#ef4444' : ''"
            >
                <i class="fas fa-heart"></i>
            </button>
            <button
                routerLink="/members/{{member().username}}"
                [queryParams]="{tab: 'Messages'}"
                class="member-icon message-btn"
                title="Send Message"
            >
                <i class="fas fa-envelope"></i>
            </button>
        </div>
    </div>
    <div class="card-body">
        <h6 class="card-title">
            <span>{{member().knownAs}}</span>
            <span class="member-age">{{member().age}}</span>
            @if (isOnline()) {
                <div class="online-indicator">
                    <div class="online-dot"></div>
                    <span>Online</span>
                </div>
            }
            @if (hasLiked()) {
                <i class="fas fa-heart" style="color: #ef4444; margin-left: auto;"></i>
            }
        </h6>
        <div class="member-location">
            <i class="fas fa-map-marker-alt"></i>
            <span>{{member().city}}, {{member().country}}</span>
        </div>
    </div>
</div>
