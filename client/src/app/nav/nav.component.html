<nav class="unified-navbar">
    <div class="container">
        <a class="navbar-brand" routerLink="/">Dating App</a>

        <ul class="navbar-nav">
        @if (accountService.currentUser()) {
            <li class="nav-item">
                <a routerLink="/members" routerLinkActive="active" class="nav-link">Matches</a>
            </li>
            <li class="nav-item">
                <a routerLink="/lists" routerLinkActive="active" class="nav-link">Lists</a>
            </li>
            <li class="nav-item">
                <a routerLink="/messages" routerLinkActive="active" class="nav-link">Messages</a>
            </li>
            <li *appHasRole="['Admin', 'Moderator']" class="nav-item">
                <a routerLink="/admin" routerLinkActive="active" class="nav-link">Admin</a>
            </li>
        }
        <li class="nav-item">
            <a routerLink="/errors" routerLinkActive="active" class="nav-link">Errors</a>
        </li>
        </ul>

        <div class="navbar-actions">
            <!-- Theme Toggle -->
            <app-theme-toggle class="me-3"></app-theme-toggle>
            
            @if (accountService.currentUser()) {
                <div dropdown class="dropdown">
                    <img
                    class="user-avatar me-2"
                    src="{{accountService.currentUser()?.photoUrl || './user.png'}}" 
                    alt="user main image">
                    <a dropdownToggle class="dropdown-toggle nav-user-link">
                        Welcome {{accountService.currentUser()?.knownAs}}
                    </a>
                    <div *dropdownMenu class="unified-dropdown-menu">
                        <a routerLink="/member/edit" class="dropdown-item">Edit Profile</a>
                        <div class="dropdown-divider"></div>
                        <a class="dropdown-item" (click)="logout()">Logout</a>
                    </div>
                </div>
            }

            @if (!accountService.currentUser()) {
                <form #loginForm="ngForm" (ngSubmit)="login()" class="unified-login-form">
                    <input name="username"
                    [(ngModel)]="model.username"
                    class="themed-input me-2"
                    placeholder="Username">

                    <input name="password" 
                    [(ngModel)]="model.password" 
                    class="themed-input me-2" 
                    type="password"
                    placeholder="Password">
                    
                    <button class="themed-btn-primary" (click)="login()" type="submit">Login</button>
                </form>
            }
        </div>
    </div>
</nav>
